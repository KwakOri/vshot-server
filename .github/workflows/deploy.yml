name: Build and deploy VShot server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_REF: ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for image push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -l -f ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << EOF
          Host deploy-server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF

      - name: Authenticate Vultr Docker client to GHCR
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GHCR_USERNAME" || { echo 'GHCR_USERNAME is required'; exit 1; }
          test -n "$GHCR_READ_TOKEN" || { echo 'GHCR_READ_TOKEN is required'; exit 1; }
          printf '%s' "$GHCR_READ_TOKEN" | ssh deploy-server "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Upload Compose file
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PATH" || { echo 'DEPLOY_PATH is required'; exit 1; }
          ssh deploy-server "mkdir -p '$DEPLOY_PATH'"
          scp -q docker-compose.production.yml "deploy-server:$DEPLOY_PATH/docker-compose.production.yml"

      - name: Deploy container
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh deploy-server "DEPLOY_PATH='$DEPLOY_PATH' IMAGE_REF='${IMAGE_REF}' bash -s" << 'ENDSSH'
          set -Eeuo pipefail

          test -f "$DEPLOY_PATH/.env.production" || {
            echo "Missing $DEPLOY_PATH/.env.production on Vultr"
            exit 1
          }

          cd "$DEPLOY_PATH"
          export VSHOT_SERVER_IMAGE="$IMAGE_REF"
          docker compose -f docker-compose.production.yml pull
          docker compose -f docker-compose.production.yml up -d --remove-orphans
          docker compose -f docker-compose.production.yml ps
          ENDSSH

      - name: Public health check
        env:
          HEALTH_CHECK_URL: ${{ secrets.HEALTH_CHECK_URL }}
        run: |
          set -euo pipefail
          if [ -n "$HEALTH_CHECK_URL" ]; then
            curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-connrefused "$HEALTH_CHECK_URL"
          else
            echo 'HEALTH_CHECK_URL is not configured; skipping public health check'
          fi
